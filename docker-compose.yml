services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: credit-risk-ml
    ports:
      - "8001:8001"
    networks:
      - credit-risk-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: credit-risk-backend
    ports:
      - "8080:8080"
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
    depends_on:
      - ml-service
    networks:
      - credit-risk-network

networks:
  credit-risk-network:
    driver: bridge